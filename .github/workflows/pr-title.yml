# Comprueba que el título de la PR siga Conventional Commits.
# Con squash, el título de la PR es el mensaje del único commit que llega a main, así que este
# check es el que mantiene limpio su historial. También avisa (sin fallar) si la PR no enlaza
# ninguna issue.

name: Título de la PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Este nombre es el status check obligatorio del ruleset de main: no lo cambies.
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: El título sigue Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Permisivo: el tipo puede ir en mayúsculas y el ámbito admite tildes, ñ y espacios.
          shopt -s nocasematch
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: *[^ ].*'
          if [[ "$TITLE" =~ $re ]]; then
            echo "Título válido: $TITLE"
          else
            echo "::error title=Título de la PR::'$TITLE' no sigue Conventional Commits (tipo(ámbito): descripción). Ejemplos: 'feat(heatmap): ingerir los datos de Open-Meteo (T-17.1)', 'fix: evitar coordenadas fuera de rango', 'docs: añadir guía de desarrollo'. Edita el título y el check se vuelve a ejecutar."
            exit 1
          fi

      - name: La PR enlaza una issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +([a-z0-9._-]+/[a-z0-9._-]+)?#[0-9]+'; then
            echo "La PR enlaza al menos una issue."
          else
            echo "::warning title=Issue enlazada::La descripción no tiene 'Closes #N'. Cada PR debería cerrar su tarea."
          fi
