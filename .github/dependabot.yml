# Actualizaciones automáticas de dependencias.
#
# Vigila las GitHub Actions de .github/workflows/, las dependencias de Maven del servidor
# (backend/) y las de pnpm de los clientes (frontend/, ecosistema npm). Una PR semanal por cada uno.
#
# Sus PRs pasan por el mismo ruleset que las demás: CI en verde y la aprobación de una persona.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    # Todas las actualizaciones de la semana en una sola PR.
    groups:
      github-actions:
        patterns: ["*"]
    # El título queda como "ci(deps): ...", que acepta el check pr-title.
    commit-message:
      prefix: ci
      include: scope
    labels: ["tarea"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      maven:
        patterns: ["*"]
    # El título queda como "build(deps): ...".
    commit-message:
      prefix: build
      include: scope
    labels: ["tarea"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    groups:
      npm:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
    labels: ["tarea"]
