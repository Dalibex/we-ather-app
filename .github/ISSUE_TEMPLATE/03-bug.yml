name: Bug
description: Algo no funciona como debería
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrirla, comprueba que nadie ha informado ya del mismo error.
        **Si es una vulnerabilidad, no abras una issue pública:** sigue `SECURITY.md`.
        No incluyas datos personales reales, contraseñas ni tokens.

  - type: textarea
    id: descripcion
    attributes:
      label: Qué falla
      description: En una o dos frases.
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true

  - type: dropdown
    id: parte
    attributes:
      label: Parte afectada
      multiple: true
      options:
        - App móvil
        - Panel de administración
        - Servidor
        - Documentación
        - CI o configuración
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión o commit
      placeholder: v0.1.0 o el SHA abc1234
    validations:
      required: true

  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y sistema
      description: Solo si el error está en una app. En la app móvil, di si usas Expo Go o una build de desarrollo.
      placeholder: Pixel 7, Android 15, Expo Go

  - type: textarea
    id: evidencias
    attributes:
      label: Evidencias
      description: Logs o respuesta HTTP, sin datos personales ni secretos. Las capturas puedes pegarlas en *Qué falla*.
      render: text
