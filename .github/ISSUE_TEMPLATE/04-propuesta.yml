name: Propuesta de funcionalidad
description: Una funcionalidad nueva o un cambio en una que ya existe
title: "[Propuesta]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        El Product Owner revisa cada propuesta contra el MoSCoW del ConOps, que fija el alcance de
        la versión 1.0. Si el ConOps la recoge como *Must*, *Should* o *Could*, la convierte en una
        historia de usuario del backlog. Si la marca como *Won't* o no la recoge, cierra la issue
        indicando que queda fuera de la 1.0 y que se podrá retomar después: es el caso de las que
        salen de Málaga, usan la ubicación en tiempo real o pintan las rutas o el mapa de calor
        sobre el mapa.

  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Qué te pasa hoy al usar WEather, no la solución.
    validations:
      required: true

  - type: textarea
    id: propuesta
    attributes:
      label: Qué propones
    validations:
      required: true

  - type: dropdown
    id: quien
    attributes:
      label: Quién la usaría
      multiple: true
      options:
        - Peatón sin cuenta
        - Usuario registrado
        - Administrador
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has pensado

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Comprobaciones
      options:
        - label: He buscado en las issues y no hay una propuesta igual.
          required: true
        - label: He leído qué queda fuera de la versión 1.0 (apartado Limitaciones del README).
          required: true
