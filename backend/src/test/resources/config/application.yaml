# Solo para las pruebas: Spring Boot lee classpath:/config/application.yaml después de
# classpath:/application.yaml, así que estos valores ganan. Desactiva las ejecuciones periódicas
# (y la carga de calles al arrancar) para que ninguna toque la base de datos ni llame a un proveedor
# en mitad de una prueba.
weather:
  heat:
    schedule:
      generation: "-"
      urban: "-"

# Clave de firma de los JWT solo para las pruebas (Base64, más de 256 bits). NO es un secreto real:
# en producción llega siempre por la variable de entorno JWT_SECRET.
jwt:
  secret: Y2xhdmUtc29sby1wYXJhLXBydWViYXMtbnVuY2EtdXNhci1lbi1wcm9kdWNjaW9uLTAxMjM0NTY3ODk=
