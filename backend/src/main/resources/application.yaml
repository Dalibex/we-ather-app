spring:
  application:
    name: weather
  jpa:
    open-in-view: false
    # El SQL no se registra por defecto (también saldría en producción). Para verlo en local,
    # pon SPRING_JPA_SHOW_SQL=true en la configuración de ejecución.
    show-sql: false
    hibernate:
      # El esquema solo lo cambia Flyway (src/main/resources/db/migration); Hibernate solo valida.
      ddl-auto: validate

weather:
  teselas:
    # Proveedor de las teselas del mapa base. OpenStreetMap exige un User-Agent que identifique a
    # la aplicación (https://operations.osmfoundation.org/policies/tiles/).
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    user-agent: WEather/0.0.1 (+https://github.com/Dalibex/we-ather-app)
    # Carpeta donde se guardan las teselas descargadas y tiempo que se sirven sin volver a pedirlas.
    directorio-cache: ${WEATHER_TESELAS_CACHE:.cache/teselas}
    caducidad: 7d

  proveedores:
    # Peticiones máximas del servidor a cada proveedor externo por ventana de tiempo. Evitan que un
    # error dispare peticiones contra el proveedor. La caché y el refresco de los datos llegan con
    # la T-20.1.
    limites:
      # Plan gratuito: 600 peticiones por minuto, 5.000 por hora y 10.000 al día
      # (https://open-meteo.com/en/terms). 400 por hora no supera ninguno de los tres.
      open-meteo:
        max-peticiones: 400
        ventana: 1h
      # AEMET OpenData no publica un límite fijo; valor prudente, pendiente de ajustar.
      aemet:
        max-peticiones: 40
        ventana: 1h
      # El portal de datos abiertos del Ayuntamiento no publica un límite; valor prudente.
      ayuntamiento-malaga:
        max-peticiones: 40
        ventana: 1h
