spring:
  application:
    name: weather
  jpa:
    open-in-view: false
    # El SQL no se registra por defecto (también saldría en producción). Para verlo en local,
    # pon SPRING_JPA_SHOW_SQL=true en la configuración de ejecución.
    show-sql: false
    hibernate:
      # El esquema solo lo cambia Flyway (src/main/resources/db/migration); Hibernate solo valida.
      ddl-auto: validate

  # Tiempo máximo de espera de las peticiones a Open-Meteo y Overpass (RestClient). Sin él, un
  # proveedor que no responde dejaría la ingesta esperando indefinidamente. La lectura admite la
  # consulta de Overpass, que puede tardar hasta 60 s ([timeout:60]).
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 90s

# Ingesta de datos para el mapa de calor (HeatIngestionProperties). La meteorológica se refresca
# sola (refresco-cron); las dos se pueden lanzar a mano con POST /api/ingestion/weather y
# POST /api/ingestion/urban.
weather:
  heat:
    # Refresco de los datos de Open-Meteo, en hora de Madrid: cada hora en punto (HU-20, T-20.1).
    # Formato cron de Spring (segundo minuto hora día mes día-de-la-semana); «-» lo desactiva.
    refresco-cron: "0 0 * * * *"
    # Open-Meteo (uso no comercial gratuito, con atribución).
    open-meteo-url: https://api.open-meteo.com/v1/forecast
    # Overpass de OpenStreetMap (ODbL, con atribución). Es un servicio compartido: no abusar.
    overpass-url: https://overpass-api.de/api/interpreter
    # Recuadro de Málaga para Overpass: sur, oeste, norte, este.
    overpass-bbox: 36.65,-4.55,36.78,-4.33
    # Con él se identifica el servidor ante Open-Meteo y Overpass, como pide la política de uso de
    # Overpass. Es el mismo que el de las teselas.
    user-agent: ${weather.teselas.user-agent}
    # Ejecución periódica (HeatmapScheduler), en hora de Europe/Madrid, con las frecuencias
    # acordadas con el PO. El tiempo se ingiere a cada hora en punto (refresco-cron); el
    # mapa se genera en el minuto 15 para usar ese dato. Con "-" se desactiva la ejecución.
    schedule:
      generation: "0 15 * * * *"
      urban: "0 0 4 * * MON"
    # Puntos de la ciudad donde se consulta el tiempo; cada uno es una petición a Open-Meteo.
    points:
      - name: Centro
        latitude: 36.7213
        longitude: -4.4214
      - name: Teatinos
        latitude: 36.7160
        longitude: -4.4720
      - name: El Palo
        latitude: 36.7210
        longitude: -4.3600
      - name: Carretera de Cádiz
        latitude: 36.7010
        longitude: -4.4440
      - name: Ciudad Jardín
        latitude: 36.7390
        longitude: -4.4300

  reportes:
    # Cuántos reportes equivalentes vale la estimación meteorológica de una zona (T-17.3).
    peso-estimacion: 5

  teselas:
    # Proveedor de las teselas del mapa base. OpenStreetMap exige un User-Agent que identifique a
    # la aplicación (https://operations.osmfoundation.org/policies/tiles/).
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    user-agent: WEather/0.0.1 (+https://github.com/Dalibex/we-ather-app)
    # Carpeta donde se guardan las teselas descargadas y tiempo que se sirven sin volver a pedirlas.
    directorio-cache: ${WEATHER_TESELAS_CACHE:.cache/teselas}
    caducidad: 7d

  proveedores:
    # Peticiones máximas del servidor a cada proveedor externo por ventana de tiempo. Evitan que un
    # error dispare peticiones contra el proveedor. Los datos de Open-Meteo se guardan y se
    # refrescan cada hora (weather.heat.refresco-cron).
    limites:
      # Plan gratuito: 600 peticiones por minuto, 5.000 por hora y 10.000 al día
      # (https://open-meteo.com/en/terms). Con ventanas fijas pueden juntarse dos ventanas
      # seguidas en pocos segundos (el final de una y el principio de la siguiente): 300 por hora
      # deja ese pico en 600, sin superar el límite por minuto.
      open-meteo:
        max-peticiones: 300
        ventana: 1h
      # AEMET OpenData no publica un límite fijo; valor prudente, pendiente de ajustar.
      aemet:
        max-peticiones: 40
        ventana: 1h
      # El portal de datos abiertos del Ayuntamiento no publica un límite; valor prudente.
      ayuntamiento-malaga:
        max-peticiones: 40
        ventana: 1h
      # Acordado con el PO: la red viaria se refresca cada siete días y el límite deja margen para
      # un reintento si Overpass corta la consulta.
      overpass:
        max-peticiones: 2
        ventana: 1d
