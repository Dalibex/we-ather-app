# Base de datos local para desarrollo. Spring Boot la arranca solo al ejecutar la aplicación.
# Nombre de proyecto fijo: sin él, Compose usa el nombre de la carpeta, y moverla crearía un
# contenedor nuevo con un volumen de base de datos vacío.
name: weather
services:
  postgres:
    # PostgreSQL con la extensión PostGIS para los datos espaciales.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Solo accesible desde la propia máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Los datos se conservan entre reinicios en el volumen postgres-data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      # Spring Boot usa esta etiqueta para configurar solo la conexión a la base de datos.
      org.springframework.boot.service-connection: postgres

volumes:
  postgres-data:
