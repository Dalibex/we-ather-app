# Workspace de los clientes: la app móvil (apps/mobile) y el panel de administración (apps/web).
packages:
  - apps/*
allowBuilds:
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - expo-file-system@58.0.14
patchedDependencies:
  react-native-maps@1.29.11: patches/react-native-maps@1.29.11.patch
